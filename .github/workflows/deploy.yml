name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4.2.2

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.x'

      - name: 📦 Install dependencies
        run: |
          pip install jinja2

      - name: 🔨 Run build script
        run: |
          python scripts/build_site.py

      - name: 🚀 SFTP Deploy
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          local_path: './*'
          remote_path: 'domains/bariatricchannel.com/public_html'
          rsyncArgs: '--exclude=.git/ --exclude=.github/ --exclude=deploy/ --exclude=scripts/ --exclude=templates/ --exclude=data/ --exclude=README.md --exclude=package.json --exclude=vercel.json --exclude=build_site.py --exclude=deploy_trigger.txt --exclude=*.py --exclude=*.mp4 --exclude=*.jpg --exclude=*.png --exclude=*.xlsx --exclude=*.stl --exclude=*.webp'
